services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  icd-api:
    image: whoicd/icd-api
    restart: unless-stopped
    environment:
      acceptLicense: "true"
      saveAnalytics: "false"
    volumes:
      - icd_api_data:/tmp
    expose:
      - "80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      icd-api:
        condition: service_started
    environment:
      ICD_API_URL: "http://icd-api:80"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/kaspersky-ca.cer
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./certs/kaspersky-ca.cer:/etc/ssl/certs/kaspersky-ca.cer:ro
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
  icd_api_data:
